 rx="8"></rect><text class="tt" x="282" y="181" text-anchor="middle" font-size="12.5" font-weight="600">저장소 접근 권한</text><text class="quiet" x="282" y="201" text-anchor="middle" font-size="12">GitHub 설정 → Claude 앱</text></g><path class="wire" d="M180 185 H206" marker-end="url(#arr)"></path><g class="node" data-k=""><rect class="b" x="384" y="160" width="148" height="50" rx="8"></rect><text class="tt" x="458" y="181" text-anchor="middle" font-size="12.5" font-weight="600">클라우드 환경 추가</text><text class="quiet" x="458" y="201" text-anchor="middle" font-size="12">네트워크: 신뢰됨</text></g><path class="wire" d="M356 185 H382" marker-end="url(#arr)"></path><g class="node" data-k=""><rect class="b" x="560" y="160" width="148" height="50" rx="8"></rect><text class="tt" x="634" y="181" text-anchor="middle" font-size="12.5" font-weight="600">연결 확인</text><text class="quiet" x="634" y="201" text-anchor="middle" font-size="12">서브에이전트 3개 표시</text></g><path class="wire" d="M532 185 H558" marker-end="url(#arr)"></path><path class="wire" d="M382 222 V234" marker-end="url(#arr)"></path><rect class="frame" x="16" y="236" width="732" height="96" rx="10"></rect><text class="" x="32" y="258" font-size="13" font-weight="600">③ Slack에 Claude 앱 추가</text><g class="node" data-k=""><rect class="b" x="32" y="270" width="148" height="50" rx="8"></rect><text class="tt" x="106" y="291" text-anchor="middle" font-size="12.5" font-weight="600">Add to Slack</text><text class="quiet" x="106" y="311" text-anchor="middle" font-size="12">허용</text></g><g class="node" data-k=""><rect class="b" x="208" y="270" width="148" height="50" rx="8"></rect><text class="tt" x="282" y="291" text-anchor="middle" font-size="12.5" font-weight="600">Claude 계정 연결</text><text class="quiet" x="282" y="311" text-anchor="middle" font-size="12">앱 홈 탭 · ②와 같은 계정</text></g><path class="wire" d="M180 295 H206" marker-end="url(#arr)"></path><g class="node" data-k=""><rect class="b" x="384" y="270" width="148" height="50" rx="8"></rect><text class="tt" x="458" y="291" text-anchor="middle" font-size="12.5" font-weight="600">Routing Mode</text><text class="quiet" x="458" y="311" text-anchor="middle" font-size="12">Code + Chat</text></g><path class="wire" d="M356 295 H382" marker-end="url(#arr)"></path><g class="node" data-k=""><rect class="b" x="560" y="270" width="148" height="50" rx="8"></rect><text class="tt" x="634" y="291" text-anchor="middle" font-size="12.5" font-weight="600">채널에 초대</text><text class="quiet" x="634" y="311" text-anchor="middle" font-size="12">/invite @Claude</text></g><path class="wire" d="M532 295 H558" marker-end="url(#arr)"></path><text class="quiet" x="382" y="362" font-size="12" text-anchor="middle">준비 완료 후 #lab-work에서 @Claude 호출로 작업 위임</text></svg>