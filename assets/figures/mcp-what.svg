<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="MCP 개요"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;fill:#1f2328}
