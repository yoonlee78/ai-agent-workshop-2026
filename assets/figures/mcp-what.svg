dth="200" height="64" rx="8"></rect><text class="" x="636" y="154" font-size="14" text-anchor="middle" font-weight="600">검색·연구 도구</text><text class="quiet" x="636" y="174" font-size="12" text-anchor="middle">arXiv 논문 검색 ← 2장</text><g class="node" data-k=""><rect class="b" x="536" y="212" width="200" height="64" rx="8"></rect><text class="tt" x="636" y="240" text-anchor="middle" font-size="14" font-weight="600">업무 도구</text><text class="quiet" x="636" y="260" text-anchor="middle" font-size="12">Slack, 캘린더, 메일</text></g><path class="wire" d="M226 76 C 258 76 258 140 288 140" marker-start="url(#arr)" marker-end="url(#arr)"></path><path class="wire" d="M226 160 H288" marker-start="url(#arr)" marker-end="url(#arr)"></path><path class="wire" d="M226 244 C 258 244 258 180 288 180" marker-start="url(#arr)" marker-end="url(#arr)"></path><path class="wire" d="M472 140 C 504 140 504 76 534 76" marker-start="url(#arr)" marker-end="url(#arr)"></path><path class="wire" d="M472 160 H534" marker-start="url(#arr)" marker-end="url(#arr)"></path><path class="wire" d="M472 180 C 504 180 504 244 534 244" marker-start="url(#arr)" marker-end="url(#arr)"></path><text class="quiet" x="380" y="304" font-size="12" text-anchor="middle">한 번 구현한 MCP 서버를 MCP 지원 AI 앱 어디서나 재사용</text></svg>