.wire.dash{stroke-dasharray:5 4}
.gbg{fill:#ddf4ff}.gfill{fill:#0969da}
.arrow{fill:#b0b8c1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"></path></marker></defs><rect class="frame" x="24" y="24" width="300" height="352" rx="10"></rect><text x="40" y="50" font-size="13" font-weight="600">메인 대화</text><text class="quiet" x="104" y="50" font-size="12">호스트 Claude</text><g class="node on" data-k="main"><rect class="b" x="40" y="64" width="268" height="196" rx="8"></rect></g><text x="56" y="92" font-size="13">나: 신입 정하늘 님 온보딩 준비 부탁해</text><text x="56" y="124" font-size="13" data-rev="m2" class="shown">→ 담당 3명에게 작업 분배</text><text x="56" y="156" font-size="13" data-rev="m3" class="shown">← 요약 보고 3건 수신</text><text x="56" y="188" font-size="13" data-rev="m4" class="shown">→ 취합 후 사용자에게 보고</text><text class="quiet shown" x="56" y="220" font-size="12" data-rev="m4">→ 사람의 결정 사항만 질의</text><text class="quiet" x="40" y="320" font-size="12">메인 대화의 컨텍스트 사용량</text><rect class="gbg" x="40" y="330" width="268" height="12" rx="6"></rect><rect class="gfill" id="g-main" x="40" y="330" width="64" height="12" rx="6"></rect><g class="node" data-k="subs"><rect class="b" x="372" y="40" width="364" height="88" rx="8"></rect><text class="tt mono" x="388" y="66" font-size="13" font-weight="600">meeting-scribe</text><text class="tt" x="600" y="66" font-size="13" font-weight="600">미팅 노트</text></g><text class="quiet shown" x="388" y="90" font-size="12" data-rev="work" data-t="w1">보고: 파일 경로, 미정 할 일 0개</text><rect class="gbg" x="388" y="104" width="332" height="8" rx="4"></rect><rect class="gfill" id="g-s1" x="388" y="104" width="220" height="8" rx="4"></rect><path class="wire" id="pO1" d="M326 150 C 350 150 346 84 370 84" marker-end="url(#arr)"></path><path class="wire dash" id="pI1" d="M370 94 C 346 94 350 166 326 166" marker-end="url(#arr)"></path><g class="node" data-k="subs"><rect class="b" x="372" y="150" width="364" height="88" rx="8"></rect><text class="tt mono" x="388" y="176" font-size="13" font-weight="600">onboarding-buddy</text><text class="tt" x="600" y="176" font-size="13" font-weight="600">신입 질문</text></g><text class="quiet shown" x="388" y="200" font-size="12" data-rev="work" data-t="w2">보고: 답 5줄 + 근거 줄</text><rect class="gbg" x="388" y="214" width="332" height="8" rx="4"></rect><rect class="gfill" id="g-s2" x="388" y="214" width="300" height="8" rx="4"></rect><path class="wire" id="pO2" d="M326 150 C 350 150 346 194 370 194" marker-end="url(#arr)"></path><path class="wire dash" id="pI2" d="M370 204 C 346 204 350 166 326 166" marker-end="url(#arr)"></path><g class="node" data-k="subs"><rect class="b" x="372" y="260" width="364" height="88" rx="8"></rect><text class="tt mono" x="388" y="286" font-size="13" font-weight="600">study-maker</text><text class="tt" x="600" y="286" font-size="13" font-weight="600">학습자료</text></g><text class="quiet shown" x="388" y="310" font-size="12" data-rev="work" data-t="w3">보고: 경로, 카드 5장, TODO 수</text><rect class="gbg" x="388" y="324" width="332" height="8" rx="4"></rect><rect class="gfill" id="g-s3" x="388" y="324" width="316" height="8" rx="4"></rect><path class="wire" id="pO3" d="M326 150 C 350 150 346 304 370 304" marker-end="url(#arr)"></path><path class="wire dash" id="pI3" d="M370 314 C 346 314 350 166 326 166" marker-end="url(#arr)"></path></svg>