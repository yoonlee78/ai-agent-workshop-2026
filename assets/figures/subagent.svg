<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="서브에이전트 위임"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;fill:#1f2328}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.quiet{fill:#636c76}
