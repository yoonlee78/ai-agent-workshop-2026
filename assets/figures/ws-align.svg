.arrow{fill:#b0b8c1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"></path></marker></defs><g class="node" data-k=""><rect class="b" x="24" y="24" width="200" height="60" rx="8"></rect><text class="tt" x="124" y="50" text-anchor="middle" font-size="14" font-weight="600">사람의 의도</text><text class="quiet" x="124" y="70" text-anchor="middle" font-size="12">실제로 바라는 결과</text></g><path class="wire" d="M226 54 H278" marker-end="url(#arr)"></path><g class="node" data-k=""><rect class="b" x="280" y="24" width="200" height="60" rx="8"></rect><text class="tt" x="380" y="50" text-anchor="middle" font-size="14" font-weight="600">지시 · 측정 기준</text><text class="quiet" x="380" y="70" text-anchor="middle" font-size="12">말이나 점수로 적은 것</text></g><path class="wire" d="M482 54 H534" marker-end="url(#arr)"></path><g class="node" data-k=""><rect class="b" x="536" y="24" width="200" height="60" rx="8"></rect><text class="tt" x="636" y="50" text-anchor="middle" font-size="14" font-weight="600">모델 행동</text><text class="quiet" x="636" y="70" text-anchor="middle" font-size="12">실제 출력</text></g><path class="wire dash" d="M636 86 V104 H137 V126" marker-end="url(#arr)"></path><path class="wire dash" d="M380 104 V126" marker-end="url(#arr)"></path><path class="wire dash" d="M636 104 V126" marker-end="url(#arr)"></path><text class="quiet" x="380" y="118" font-size="12" text-anchor="middle" font-weight="600">Alignment 실패 유형</text><g class="node" data-k=""><rect class="b" x="24" y="128" width="226" height="64" rx="8"></rect><text class="tt" x="137" y="156" text-anchor="middle" font-size="15" font-weight="600">Reward hacking</text><text class="quiet" x="137" y="176" text-anchor="middle" font-size="12">기준 충족 · 의도 이탈</text></g><g class="node" data-k=""><rect class="b" x="267" y="128" width="226" height="64" rx="8"></rect><text class="tt" x="380" y="156" text-anchor="middle" font-size="1