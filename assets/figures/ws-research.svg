<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 166" role="img" aria-label="연구 도구와 연구 대상으로서의 LLM"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;fill:#1f2328}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.quiet{fill:#636c76}
.b{fill:#ffffff;stroke:#d8dee4;stroke-width:1.25}
.b.hl{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
.frame{fill:none;stroke:#d8dee4;stroke-width:1.25}
.tint{fill:#ddf4ff;stroke:none}
.node.on .b{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
.node.on .tt{fill:#0969da}
.wire{fill:none;stroke:#b0b8c1;stroke-width:1.5}
.wire.dash{stroke-dasharray:5 4}
.gbg{fill:#ddf4ff}.gfill{fill:#0969da}
.arrow{fill:#b0b8c1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"></path></marker></defs><rect class="b hl" x="24" y="20" width="340" height="126" rx="12"></rect><text class="" x="194" y="48" font-size="14" text-anchor="middle" font-weight="700">LLM을 연구 도구로 (오늘 실습)</text><text class="" x="44" y="80" font-size="12">· 미팅 노트, 핸드북 답변, 학습 카드</text><text class="" x="44" y="104" font-size="12">· 질문 로그 리포트, 연구윤리 점검</text><text class="" x="44" y="128" font-size="12">· 위키, 인터뷰 전사, 장비 절차 (9장)</text><rect class="b" x="396" y="20" width="340" height="126" rx="12"></rect><text class="" x="566" y="48" font-size="14" text-anchor="middle" font-weight="700">LLM을 연구 대상으로</text><text class="" x="416" y="80" font-size="12">· 인지 과제 수행 (Binz &amp; Schulz)</text><text class="" x="416" y="104" font-size="12">· 인간 응답 시뮬레이션 (Argyle et al.)</text><text class="" x="416" y="128" font-size="12">· 인간 선택 예측 모델 (Centaur)</text></svg>