.arrow{fill:#b0b8c1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"></path></marker></defs><rect class="frame" x="16" y="16" width="360" height="340" rx="10"></rect><text x="32" y="38" font-size="13" font-weight="600">Claude Code</text><text class="quiet mono" x="132" y="38" font-size="11">~/ai-agent-workshop-2026</text><g data-rev="c1" class="shown"><rect class="b hl" x="150" y="52" width="214" height="30" rx="14"></rect><text x="162" y="72" font-size="12">인큐베이터를 37도로 맞춰줘</text></g><g data-rev="c2" class="shown"><rect class="b" x="28" y="90" width="300" height="30" rx="14"></rect><text x="40" y="110" font-size="12">설명서를 읽고 지금 상태를 볼게요</text></g><g data-rev="c3" class="shown"><text class="mono quiet" x="40" y="138" font-size="11">● describe_device · read_value ×2</text></g><g data-rev="c4" class="shown"><text class="mono quiet" x="40" y="158" font-size="11">● write_value setpoint 30 → 35 → 37</text></g><g data-rev="c5" class="shown"><rect class="b" x="28" y="170" width="330" height="30" rx="14"></rect><text x="40" y="190" font-size="12">30 → 35 → 37로 나눠 올렸어요 (한 번에 5°C)</text></g><g data-rev="c6" class="shown"><rect class="b hl" x="168" y="212" width="196" height="30" rx="14"></rect><text x="180" y="232" font-size="12">45도로 올려줘. 급해</text></g><g data-rev="c7" class="shown"><rect class="b" x="28" y="250" width="330" height="30" rx="14"></rect><text x="40" y="270" font-size="12">45°C는 범위(20~42) 밖이에요. 최안전께 먼저</text></g><g id="pop" style="opacity:0;transition:opacity .3s"><rect class="b hl" x="40" y="286" width="320" height="58" rx="8"></rect><text x="54" y="306" font-size="12" font-weight="600">lab-devices - write_value 를 허용할까요?</text><text class="mono" x="54" y="326" font-size="11.5" data-t="popv">setpoint = 35</text><text x="318" y="326" font-size="12" font-weight="700">Yes</text></g><rect class="frame" x="396" y="16" width="348" height="340" rx="10"></rect><text x="412" y="38" font-size="13" font-weight="600">incubator-1</text><text class="quiet" x="500" y="38" font-size="11">가상 인큐베이터</text><rect class="b" x="440" y="56" width="170" height="200" rx="10"></rect><rect class="frame" x="456" y="72" width="138" height="168" rx="6"></rect><line class="wire" x1="466" y1="130" x2="584" y2="130"></line><line class="wire" x1="466" y1="180" x2="584" y2="180"></line><text x="525" y="162" text-anchor="middle" font-size="26" font-weight="700" data-t="tbig">36.8°C</text><text class="quiet" x="525" y="212" text-anchor="middle" font-size="12" data-t="sp">설정 온도 37</text><text class="quiet" x="632" y="72" font-size="11">42</text><text class="quiet" x="632" y="252" font-size="11">20</text><rect class="frame" x="660" y="64" width="22" height="188" rx="10"></rect><rect id="gauge" class="b hl" x="663" y="108" width="16" height="141" rx="7" style="transition:all .9s ease"></rect><line class="wire dash" x1="655" y1="90" x2="690" y2="90"></line><text class="quiet" x="694" y="94" font-size="10.5">40</text><g class="node on" data-k="drv"><rect class="b" x="412" y="270" width="316" height="74" rx="8"></rect><text class="tt mono" x="570" y="303" text-anchor="middle" font-size="12.5" font-weight="600">device_driver.py</text><text class="quiet" x="570" y="323" text-anchor="middle" font-size="12" data-t="drv">(만약 보냈다면) 거절: 45°C 는 허용 범위 20~42°C 밖</text></g></svg>