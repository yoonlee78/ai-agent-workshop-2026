g class="node on" data-k="zone"><rect class="b" x="206" y="118" width="170" height="66" rx="8"></rect><text class="tt" x="291" y="147" text-anchor="middle" font-size="13" font-weight="600">작업 구역 센서</text><text class="quiet" x="291" y="167" text-anchor="middle" font-size="12" data-t="zone">zone = occupied</text></g><g class="node on" data-k="drv"><rect class="b" x="396" y="118" width="170" height="66" rx="8"></rect><text class="tt" x="481" y="147" text-anchor="middle" font-size="13" font-weight="600">드라이버</text><text class="quiet" x="481" y="167" text-anchor="middle" font-size="12" data-t="drv">시작하지 않음</text></g><g class="node" data-k="arm"><rect class="b" x="586" y="118" width="158" height="66" rx="8"></rect><text class="tt" x="665" y="147" text-anchor="middle" font-size="13" font-weight="600">로봇 팔 (가상)</text><text class="quiet" x="665" y="167" text-anchor="middle" font-size="12" data-t="arm">움직이지 않음</text></g><g class="node" data-k="msg"><rect class="b" x="16" y="204" width="728" height="66" rx="8"></rect><text class="tt" x="380" y="233" text-anchor="middle" font-size="13" font-weight="600">현재 단계</text><text class="quiet" x="380" y="253" text-anchor="middle" font-size="12" data-t="msg">작업 구역에 사람이 있으면 첫 단계도 실행하지 않음</text></g></svg>