.arrow{fill:#b0b8c1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"></path></marker></defs><rect class="frame" x="12" y="12" width="736" height="476" rx="10" stroke-dasharray="5 4"></rect><text class="quiet" x="28" y="34" font-size="12" font-weight="600">조교 팀 구성 · 모두 내 저장소 ai-agent-workshop-2026에 저장</text><rect class="b hl" x="250" y="120" width="260" height="190" rx="12"></rect><text class="" x="380" y="146" font-size="15" text-anchor="middle" font-weight="700">호스트 에이전트</text><text class="quiet" x="380" y="164" font-size="12" text-anchor="middle">Claude Code (나와 대화하는 Claude)</text><g class="node" data-k=""><rect class="b" x="268" y="182" width="108" height="74" rx="8"></rect><text class="tt" x="322" y="215" text-anchor="middle" font-size="14" font-weight="600">LLM</text><text class="quiet" x="322" y="235" text-anchor="middle" font-size="12">추론·판단</text></g><g class="node" data-k=""><rect class="b" x="384" y="182" width="108" height="74" rx="8"></rect><text class="tt" x="438" y="215" text-anchor="middle" font-size="14" font-weight="600">도구</text><text class="quiet mono" x="438" y="235" text-anchor="middle" font-size="12">Read·Write·Bash</text></g><text class="quiet" x="380" y="288" font-size="12" text-anchor="middle">추론 → 도구 → 관찰의 반복 (에이전트 루프)</text><text class="" x="28" y="70" font-size="13" font-weight="600">스킬 · 수행 절차</text><g class="node" data-k=""><rect class="b" x="28" y="80" width="180" height="48" rx="8"></rect><text class="tt mono" x="118" y="100" text-anchor="middle" font-size="13" font-weight="600">meeting-notes</text><text class="quiet" x="118" y="120" text-anchor="middle" font-size="12">미팅 노트 양식 (1장)</text></g><g class="node" data-k=""><rect class="b" x="28" y="134" width="180" height="48" rx="8"></rect><text class="tt mono" x="118" y="154" text-anchor="middle" font-size="13" font-weight="600">question-report</text><text class="quiet" x="118" y="174" text-anchor="middle" font-size="12">질문 로그 리포트 (5장)</text></g><g class="node" data-k=""><rect class="b" x="28" y="188" width="180" height="48" rx="8"></rect><text class="tt mono" x="118" y="208" text-anchor="middle" font-size="13" font-weight="600">report-format</text><text class="quiet" x="118" y="228" text-anchor="middle" font-size="12">리포트 양식 (5장)</text></g><g class="node" data-k=""><rect class="b" x="28" y="242" width="180" height="48" rx="8"></rect><text class="tt mono" x="118" y="262" text-anchor="middle" font-size="13" font-weight="600">workshop-tutor</text><text class="quiet" x="118" y="282" text-anchor="middle" font-size="12">자동 진행 모드 (미리 들어 있음)</text></g><text class="quiet" x="28" y="312" font-size="12">description만 상시 로딩,</text><text class="quiet" x="28" y="328" font-size="12">본문은 필요 시 로딩</text><path class="wire" d="M210 172 C 230 172 232 200 248 200" marker-end="url(#arr)"></path><text class="" x="552" y="70" font-size="13" font-weight="600">MCP · 외부 연결</text><g class="node" data-k=""><rect class="b" x="552" y="84" width="108" height="64" rx="8"></rect><text class="tt mono" x="606" y="112" text-anchor="middle" font-size="12" font-weight="600">arxiv</text><text class="quiet" x="606" y="132" text-anchor="middle" font-size="12">MCP 서버 (2장)</text></g><g class="node" data-k=""><rect class="b" x="676" y="84" width="60" height="64" rx="8"></rect><text class="tt quiet" x="706" y="121" text-anchor="middle" font-size="12" font-weight="600">arXiv</text></g><path class="wire" d="M512 190 C 530 190 530 116 550 116" marker-end="url(#arr)"></path><path class="wire" d="M662 116 H674" marker-end="url(#arr)"></path><text class="quiet" x="552" y="172" font-size="12">외부 시스템 접근은</text><text class="quiet" x="552" y="188" font-size="12">MCP 서버를 경유</text><g class="node" data-k=""><rect class="b" x="28" y="366" width="166" height="64" rx="8"></rect><text class="tt mono" x="111" y="394" text-anchor="middle" font-size="13" font-weight="600">meeting-scribe</text><t