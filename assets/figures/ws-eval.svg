<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Alignment auditing"><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;fill:#1f2328}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.quiet{fill:#636c76}
.b{fill:#ffffff;stroke:#d8dee4;stroke-width:1.25}
.b.hl{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
.frame{fill:none;stroke:#d8dee4;stroke-width:1.25}
.tint{fill:#ddf4ff;stroke:none}
.node.on .b{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
.node.on .tt{fill:#0969da}
.wire{fill:none;stroke:#b0b8c1;stroke-width:1.5}
.wire.dash{stroke-dasharray:5 4}
.gbg{fill:#ddf4ff}.gfill{fill:#0969da}
.arrow{fill:#b0b8c1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0L10 5L0 10z"></path></marker></defs><path class="wire" id="eB2A" d="M216 63 H234" marker-end="url(#arr)"></path><path class="wire" id="eA2T" d="M396 54 H414" marker-end="url(#arr)"></path><path class="wire dash" id="eT2A" d="M414 74 H398" marker-end="url(#arr)"></path><path class="wire" id="eT2J" d="M576 63 H594" marker-end="url(#arr)"></path><path class="wire" id="eJ2S" d="M670 96 V116" marker-end="url(#arr)"></path><g class="node" data-k="beh"><rect class="b" x="16" y="30" width="200" height="66" rx="8"></rect><text class="tt" x="116" y="59" text-anchor="middle" font-size="13" font-weight="600">평가 대상 행동</text><text class="quiet" x="116" y="79" text-anchor="middle" font-size="12" data-t="beh">Sycophancy</text></g><g class="node" data-k="aud"><rect class="b" x="236" y="30" width="160" height="66" rx="8"></rect><text class="tt" x="316" y="59" text-anchor="middle" font-size="13" font-weight="600">Auditor AI</text><text class="quiet" x="316" y="79" text-anchor="middle" font-size="12" data-t="aud">시나리오 생성</text></g><g class="node" data-k="tgt"><rect class="b" x="416" y="30" width="160" height="66" rx="8"></rect><text class="tt" x="496" y="59" text-anchor="middle" font-size="13" font-weight="600">Target 에이전트</text><text class="quiet" x="496" y="79" text-anchor="middle" font-size="12" data-t="tgt">응답</text></g><g class="node" data-k="jdg"><rect class="b" x="596" y="30" width="148" height="66" rx="8"></rect><text class="tt" x="670" y="59" text-anchor="middle" font-size="13" font-weight="600">Judge AI</text><text class="quiet" x="670" y="79" text-anchor="middle" font-size="12" data-t="jdg">대화 기록 분석</text></g><g class="node" data-k="conv"><rect class="b" x="16" y="118" width="560" height="66" rx="8"></rect><text class="tt" x="296" y="147" text-anchor="middle" font-size="13" font-weight="600">대화</text><text class="quiet" x="296" y="167" text-anchor="middle" font-size="12" data-t="conv">"p = .08 이라 유의하지 않습니다" 또는 "네, 유의합니다"</text></g><g class="node on" data-k="score"><rect class="b" x="596" y="118" width="148" height="66" rx="8"></rect><text class="tt" x="670" y="147" text-anchor="middle" font-size="13" font-weight="600">점수</text><text class="quiet" x="670" y="167" text-anchor="middle" font-size="12" data-t="score">행동 발생 정도</text></g><g class="node" data-k="msg"><rect class="b" x="16" y="200" width="728" height="70" rx="8"></rect><text class="tt" x="380" y="231" text-anchor="middle" font-size="13" font-weight="600">현재 단계</text><text class="quiet" x="380" y="251" text-anchor="middle" font-size="12" data-t="msg">규칙("답을 정해 준 질문에도 근거로만 답한다") 추가 후 재측정. 점수가 낮아져야 평가가 규칙 효과를 포착한 것이다</text></g></svg>