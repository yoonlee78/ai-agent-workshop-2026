<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<rect width="720" height="408" rx="12" fill="#f6f7f9"/>
<text x="20" y="28" font-size="13" font-weight="700" fill="#333">예시: 에이전트가 마지막에 보여 주는 점검 표</text>
<text x="26" y="50" font-size="12" font-weight="700" fill="#b4540a">항목</text>
<text x="256" y="50" font-size="12" font-weight="700" fill="#b4540a">결과</text>
<text x="356" y="50" font-size="12" font-weight="700" fill="#b4540a">확인 내용</text>
<rect x="20" y="58" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="78" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">git --version</text>
<text x="256" y="78" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="78" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">git version 2.54.0</text>
<rect x="20" y="92" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="112" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">node --version</text>
<text x="256" y="112" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="112" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">v24.21.0</text>
<rect x="20" y="126" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="146" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">gh --version</text>
<text x="256" y="146" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="146" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">gh version 2.102.0</text>
<rect x="20" y="160" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="180" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">uvx --version</text>
<text x="256" y="180" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="180" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">uvx 0.13.0</text>
<rect x="20" y="194" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="214" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">Claude 또는 Codex</text>
<text x="256" y="214" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="214" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">claude는 없음, codex-cli 0.162.1은 있음</text>
<rect x="20" y="228" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="248" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">gh auth status</text>
<text x="256" y="248" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="248" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">&lt;아이디&gt; 계정 로그인됨</text>
<rect x="20" y="262" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="282" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">git config user.name</text>
<text x="256" y="282" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="282" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">&lt;이름&gt;</text>
<rect x="20" y="296" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="316" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">git config user.email</text>
<text x="256" y="316" font-size="12" font-weight="700" fill="#1a7f37">✓ 통과</text>
<text x="356" y="316" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">&lt;이메일&gt;</text>
<rect x="20" y="330" width="680" height="30" rx="5" fill="#fff" stroke="#e1e4e8"/>
<text x="30" y="350" font-size="12" fill="#2f6f1f" font-family="Menlo, Consolas, monospace">ai-agent-workshop-2026 저장소</text>
<text x="256" y="350" font-size="12" font-weight="700" fill="#6b7280">아직 없음</text>
<text x="356" y="350" font-size="12" fill="#333" font-family="Menlo, Consolas, monospace">&lt;아이디&gt;/ai-agent-workshop-2026 찾지 못함 (정상)</text>
<text x="20" y="392" font-size="12" fill="#1a7f37">✓ 모두 통과, 마지막 줄은 "아직 없음"이면 준비 끝 (Claude·Codex는 하나만 있어도 통과)</text>
</svg>